<section class="forbidden">
  <div class="forbidden__card">
    <div class="forbidden__icon" aria-hidden="true">
      <mat-icon>lock</mat-icon>
    </div>
    <p class="forbidden__eyebrow">Access denied</p>
    <h1>You do not have access to this page</h1>
    <p class="forbidden__message">
      Your account is signed in, but your role does not include permission to view
      this area. If you believe this is a mistake, contact your workspace
      administrator.
    </p>
    <div class="forbidden__actions">
      <a mat-flat-button color="primary" routerLink="/">Back to dashboard</a>
      <button mat-stroked-button type="button" (click)="logout()">Sign out</button>
    </div>
  </div>
</section>
