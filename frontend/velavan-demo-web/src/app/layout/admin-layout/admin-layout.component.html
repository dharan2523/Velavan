<mat-sidenav-container class="admin-shell">
  <mat-sidenav
    class="admin-shell__sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (closedStart)="closeSidenavOnNavigate()"
  >
    <app-sidebar (navigate)="closeSidenavOnNavigate()" />
  </mat-sidenav>

  <mat-sidenav-content class="admin-shell__content">
    <app-header (menuToggle)="toggleSidenav()" />
    <main class="admin-shell__main">
      <router-outlet />
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
